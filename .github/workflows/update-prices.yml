name: Update FC prices

on:
  workflow_dispatch:
  schedule:
    - cron: '17 0 * * *'

permissions:
  contents: write

concurrency:
  group: fc-price-history-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install 'requests>=2.32.3,<3'

      - name: Collect prices
        env:
          PYTHONUNBUFFERED: '1'
          WORKERS: '12'
          REQUESTS_PER_SECOND: '16'
          KEEP_DAYS: '90'
        run: python graphcrawler.py

      - name: Keep collected file as artifact
        if: ${{ always() && hashFiles('price_history.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: price-history-${{ github.run_id }}-${{ github.run_attempt }}
          path: price_history.json
          retention-days: 7

      - name: Commit small history file
        run: |
          test -s price_history.json
          SIZE=$(stat -c%s price_history.json)
          echo "price_history.json size=$SIZE bytes"

          if [ "$SIZE" -ge 95000000 ]; then
            echo "File is too large for normal GitHub storage."
            echo "Artifact upload is preserved, so stopping before git push."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- price_history.json

          if git diff --cached --quiet; then
            echo 'No price changes'
            exit 0
          fi

          git commit -m 'Update FC price history'
          git push
